name: Build litert_lm_main.exe

on:
  workflow_dispatch:          # trigger manually from the Actions tab
    inputs:
      build_llm:
        description: "Build litert_lm_main / litert_lm_advanced_main"
        type: boolean
        default: true

defaults:
  run:
    shell: powershell

jobs:
  build:
    runs-on: windows-latest   # ships with VS 2022 + MSVC — no local install needed
    timeout-minutes: 180
    env:
      # Mirrors upstream ml-ci-build-win.yml: clear only the NDK vars
      # (runner NDK breaks androidndk symlinks); keep ANDROID_HOME.
      ANDROID_NDK_HOME:
      ANDROID_NDK_ROOT:

    steps:
      # ── Prerequisites ────────────────────────────────────────────────────────
      - name: Enable long paths
        run: |
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Configure system paths (Git tools incl. sed for Bazel patch_cmds)
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\cmd"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\mingw64\bin"

      # Bazel patch_cmds run `bash -c ...`. Windows process lookup checks
      # System32 before PATH, so the WSL launcher C:\Windows\System32\bash.exe
      # wins over Git bash and fails silently. Remove it on this throwaway VM.
      - name: Remove WSL bash.exe shim
        run: |
          foreach ($p in "C:\Windows\System32\bash.exe","C:\Windows\SysWOW64\bash.exe") {
            if (Test-Path $p) {
              takeown /f $p | Out-Null
              icacls $p /grant "*S-1-5-32-544:F" | Out-Null
              Remove-Item $p -Force
              Write-Host "Removed $p"
            }
          }
          Write-Host "bash candidates now:"; where.exe bash
          bash -c "echo bash OK; which sed; sed --version | head -1"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}

      - name: Short temp dir + output base (avoid MAX_PATH issues)
        run: |
          New-Item -ItemType Directory -Force -Path C:\_w\_tmp | Out-Null
          New-Item -ItemType Directory -Force -Path C:\_w\_b   | Out-Null
          subst B: C:\_w\_b
          echo "TMP=C:\_w\_tmp"  >> $env:GITHUB_ENV
          echo "TEMP=C:\_w\_tmp" >> $env:GITHUB_ENV
          echo "BAZEL_OUTPUT_BASE=B:\job" >> $env:GITHUB_ENV

      # ── Source ───────────────────────────────────────────────────────────────
      - name: Clone LiteRT-LM
        run: git clone --depth=1 https://github.com/google-ai-edge/LiteRT-LM.git

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build litert_lm_main and litert_lm_advanced_main
        if: ${{ inputs.build_llm }}
        working-directory: LiteRT-LM
        run: |
          bazelisk --output_base="$env:BAZEL_OUTPUT_BASE" build `
            --deleted_packages=swift `
            --action_env=TMP="$env:TMP" --action_env=TEMP="$env:TEMP" `
            //runtime/engine:litert_lm_main //runtime/engine:litert_lm_advanced_main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Separate step so a failure here doesn't hide the LLM binaries above
      - name: Build omni_runner (TTS / ASR runner, e.g. Kokoro)
        continue-on-error: true
        working-directory: LiteRT-LM
        run: |
          # /utf-8: Kokoro G2P sources contain UTF-8 char literals (e.g. 'à');
          # MSVC otherwise reads them in the ANSI codepage -> error C2015.
          bazelisk --output_base="$env:BAZEL_OUTPUT_BASE" build -c opt `
            --deleted_packages=swift `
            --copt=/utf-8 --host_copt=/utf-8 `
            --action_env=TMP="$env:TMP" --action_env=TEMP="$env:TEMP" `
            //omni:omni_runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Collect binary + DLLs
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $binDir = "LiteRT-LM\bazel-bin\runtime\engine"
          if (Test-Path "$binDir\litert_lm_main.exe") {
            Copy-Item "$binDir\litert_lm_main.exe" dist\
            Copy-Item "$binDir\litert_lm_advanced_main.exe" dist\
            Get-ChildItem "$binDir\*.dll" -ErrorAction SilentlyContinue |
              Copy-Item -Destination dist\
          }
          $omniDir = "LiteRT-LM\bazel-bin\omni"
          if (Test-Path "$omniDir\omni_runner.exe") {
            Copy-Item "$omniDir\omni_runner.exe" dist\
            Get-ChildItem "$omniDir\*.dll" -ErrorAction SilentlyContinue |
              Copy-Item -Destination dist\ -Force
          } else {
            Write-Host "omni_runner.exe was not built"
          }
          Write-Host "Contents of dist/:"
          Get-ChildItem dist\ | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litert_lm_main-windows-x64
          path: dist\
          retention-days: 30
